name: Build macOS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch master https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package ZIP (teste rápido, sem instalador)
        run: |
          mkdir -p dist
          cp -R "build/VocalCompressor_artefacts/Release/VST3/NF - Color Comp.vst3" dist/
          cp -R "build/VocalCompressor_artefacts/Release/AU/NF - Color Comp.component" dist/
          cp -R "build/VocalCompressor_artefacts/Release/Standalone/NF - Color Comp.app" dist/
          ls -la dist
          (cd dist && zip -r -y "../VocalCompressor-macOS.zip" .)

      - name: Build installer (.pkg instalando nos 3 destinos + .dmg)
        run: |
          mkdir -p pkgroot/vst3 pkgroot/au pkgroot/app pkgroot/docs
          cp -R "build/VocalCompressor_artefacts/Release/VST3/NF - Color Comp.vst3" pkgroot/vst3/
          cp -R "build/VocalCompressor_artefacts/Release/AU/NF - Color Comp.component" pkgroot/au/
          cp -R "build/VocalCompressor_artefacts/Release/Standalone/NF - Color Comp.app" pkgroot/app/

          # Manual em PDF - local FIXO e compartilhado (Application Support,
          # não dentro de nenhum formato específico), porque o VST3/AU/AAX/
          # Standalone instalam em pastas diferentes e o botão "Manual" da
          # tela About (ver Source/UI/AboutOverlay.h) precisa achar o
          # arquivo não importa qual formato esteja rodando.
          mkdir -p "pkgroot/docs/Library/Application Support/NF Plugins/Color Comp"
          cp "installer/docs/NF-Color-Comp-Manual-PT.pdf" "pkgroot/docs/Library/Application Support/NF Plugins/Color Comp/"

          pkgbuild --root pkgroot/vst3 --install-location "/Library/Audio/Plug-Ins/VST3" \
            --identifier com.nf.vocalcompressor.vst3 --version 1.0 vst3.pkg
          pkgbuild --root pkgroot/au --install-location "/Library/Audio/Plug-Ins/Components" \
            --identifier com.nf.vocalcompressor.au --version 1.0 au.pkg
          pkgbuild --root pkgroot/app --install-location "/Applications" \
            --identifier com.nf.vocalcompressor.app --version 1.0 app.pkg
          pkgbuild --root pkgroot/docs --install-location "/" \
            --identifier com.nf.vocalcompressor.docs --version 1.0 docs.pkg

          cat > distribution.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
              <title>NF - Color Comp</title>
              <options customize="never" require-scripts="false"/>
              <choices-outline>
                  <line choice="default">
                      <line choice="vst3"/>
                      <line choice="au"/>
                      <line choice="app"/>
                      <line choice="docs"/>
                  </line>
              </choices-outline>
              <choice id="default"/>
              <choice id="vst3" visible="false"><pkg-ref id="com.nf.vocalcompressor.vst3"/></choice>
              <choice id="au" visible="false"><pkg-ref id="com.nf.vocalcompressor.au"/></choice>
              <choice id="app" visible="false"><pkg-ref id="com.nf.vocalcompressor.app"/></choice>
              <choice id="docs" visible="false"><pkg-ref id="com.nf.vocalcompressor.docs"/></choice>
              <pkg-ref id="com.nf.vocalcompressor.vst3" version="1.0" onConclusion="none">vst3.pkg</pkg-ref>
              <pkg-ref id="com.nf.vocalcompressor.au" version="1.0" onConclusion="none">au.pkg</pkg-ref>
              <pkg-ref id="com.nf.vocalcompressor.app" version="1.0" onConclusion="none">app.pkg</pkg-ref>
              <pkg-ref id="com.nf.vocalcompressor.docs" version="1.0" onConclusion="none">docs.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          productbuild --distribution distribution.xml --package-path . "NF - Color Comp Installer.pkg"

          mkdir -p dmg_root
          cp "NF - Color Comp Installer.pkg" dmg_root/

          # Ícone da marca NF Plugins no volume do DMG (o que aparece quando
          # a pessoa monta o .dmg) e no próprio arquivo .dmg (o que aparece
          # no Finder/Downloads antes de montar). Tolerante a falha - se
          # alguma ferramenta não existir no runner, o build continua sem
          # ícone custom em vez de quebrar.
          mkdir -p icon.iconset
          sips -z 16 16     installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   installer/macos/nf-plugins-icon-512.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon.icns || true

          if [ -f icon.icns ]; then
            cp icon.icns dmg_root/.VolumeIcon.icns
            SetFile -a C dmg_root || true
            SetFile -c icnC dmg_root/.VolumeIcon.icns || true
          fi

          hdiutil create -volname "NF - Color Comp" -srcfolder dmg_root -ov -format UDZO VocalCompressor-macOS.dmg

          if [ -f icon.icns ]; then
            DeRez -only icns icon.icns > icon.rsrc || true
            Rez -append icon.rsrc -o VocalCompressor-macOS.dmg || true
            SetFile -a C VocalCompressor-macOS.dmg || true
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalCompressor-macOS-ZIP
          path: VocalCompressor-macOS.zip
          if-no-files-found: error

      - name: Upload Installer (DMG) artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalCompressor-macOS-DMG
          path: VocalCompressor-macOS.dmg
          if-no-files-found: error

      - name: Publish installer to nf-releases (depósito privado)
        env:
          GH_TOKEN: ${{ secrets.NF_RELEASES_TOKEN }}
        run: |
          cp "VocalCompressor-macOS.dmg" "vocal-compressor-macos.dmg"
          gh release view vocal-compressor --repo creativepfb/nf-releases >/dev/null 2>&1 || \
            gh release create vocal-compressor --repo creativepfb/nf-releases \
              --title "NF - Color Comp" \
              --notes "Instaladores publicados automaticamente pelo CI - sempre a versao mais recente."
          gh release upload vocal-compressor \
            "vocal-compressor-macos.dmg" \
            --repo creativepfb/nf-releases --clobber
